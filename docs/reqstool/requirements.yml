# yaml-language-server: $schema=https://raw.githubusercontent.com/reqstool/reqstool-client/main/src/reqstool/resources/schemas/v1/requirements.schema.json
metadata:
  urn: atunko
  variant: system
  title: Atunko System Requirements
  url: https://github.com/atunko/atunko

implementations:
  local:
    - path: ../../atunko-core/docs/reqstool
    - path: ../../atunko-cli/docs/reqstool
    - path: ../../atunko-tui/docs/reqstool
    - path: ../../atunko-web/docs/reqstool

requirements:
  # Web UI requirements
  - id: WEB_0001
    title: Web UI Launch
    significance: shall
    description: >-
      The tool shall provide a browser-based recipe browser via CLI subcommand,
      launching an embedded Jetty server accessible on localhost
    categories: [interaction-capability]
    revision: 0.1.0

  - id: WEB_0001.1
    title: Web UI — Recipe TreeGrid
    significance: shall
    description: >-
      The Web UI shall display all discovered recipes in a hierarchical tree grid,
      with composite recipes expandable to show their sub-recipes
    references:
      requirement_ids: ["WEB_0001"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: WEB_0001.2
    title: Web UI — Search and Tag Filter
    significance: shall
    description: >-
      The Web UI shall support real-time text search (name, description, tags) and
      multi-select tag filtering (OR/ANY logic), composing with AND between filters
    references:
      requirement_ids: ["WEB_0001"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: WEB_0001.3
    title: Web UI — Port Option
    significance: shall
    description: The Web UI subcommand shall accept a configurable port option, defaulting to 8080
    references:
      requirement_ids: ["WEB_0001"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: WEB_0001.4
    title: Web UI — Expand/Collapse Composite Recipes
    significance: shall
    description: >-
      The Web UI shall allow expanding and collapsing composite recipes in the tree grid
      to show or hide their sub-recipe list
    references:
      requirement_ids: ["WEB_0001"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: WEB_0001.5
    title: Web UI — Cascade Multi-Select
    significance: shall
    description: >-
      The Web UI shall support multi-select with cascade-both-ways checkbox logic:
      selecting a parent selects all children; selecting all children selects the parent;
      deselecting one child puts the parent into indeterminate state
    references:
      requirement_ids: ["WEB_0001"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: WEB_0001.6
    title: Web UI — Detail Panel
    significance: shall
    description: >-
      The Web UI shall display a detail panel showing the selected recipe's name,
      description, tags, recipe list (if composite), and options
    references:
      requirement_ids: ["WEB_0001"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: WEB_0001.7
    title: Web UI — Project Directory Option
    significance: shall
    description: >-
      The Web UI subcommand shall accept a --project-dir option specifying the target project
      directory for recipe execution, defaulting to the current working directory
    references:
      requirement_ids: ["WEB_0001"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: WEB_0001.8
    title: Web UI — Execution Services Initialisation
    significance: shall
    description: >-
      The Web UI shall initialise shared execution services (RecipeExecutionEngine,
      ProjectSourceParser, ChangeApplier) at startup via AppServices, making them
      available to all Vaadin views without duplication
    references:
      requirement_ids: ["WEB_0001"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: WEB_0001.9
    title: Web UI — Recipe Execution and Dry-Run Preview
    significance: shall
    description: >-
      The Web UI shall allow the user to execute selected recipes against the target project
      and optionally preview the resulting file changes (dry-run) before applying them
    references:
      requirement_ids: ["WEB_0001"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: WEB_0001.10
    title: Web UI — Run Order Dialog
    significance: shall
    description: >-
      The Web UI shall show a mandatory run order dialog before every recipe execution,
      with an ordered list of selected recipes, move-up/down controls for reordering,
      and a flatten-composites toggle that recursively expands composites into leaf recipes
    references:
      requirement_ids: ["WEB_0001"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: WEB_0001.11
    title: Web UI — Save Named Run Configuration
    significance: shall
    description: >-
      The Web UI shall allow saving the current recipe selection as a named run
      configuration to atunko/runs/<name>.yaml using the core RunConfigService
    references:
      requirement_ids: ["WEB_0001"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: WEB_0001.12
    title: Web UI — Load Named Run Configuration
    significance: shall
    description: >-
      The Web UI shall allow loading a saved run configuration from atunko/runs/*.yaml,
      resolving recipe names to available recipes and selecting them in the tree grid
    references:
      requirement_ids: ["WEB_0001"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: WEB_0001.13
    title: Web UI — Recipe Sorting
    significance: shall
    description: >-
      The Web UI shall provide a sort-order dropdown allowing the user to sort recipes
      by name (alphabetical) or by tags (grouped by first tag, then alphabetical)
    references:
      requirement_ids: ["WEB_0001"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: WEB_0001.14
    title: Web UI — Bulk Select and Deselect
    significance: shall
    description: >-
      The Web UI shall provide Select All and Deselect All buttons that respect active
      filters, selecting or deselecting only the currently visible recipes
    references:
      requirement_ids: ["WEB_0001"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: WEB_0001.15
    title: Web UI — Coverage Indicators
    significance: shall
    description: >-
      The Web UI shall display a visual badge on recipes that are transitively included
      in a selected composite recipe, indicating they will be executed as part of the composite
    references:
      requirement_ids: ["WEB_0001"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: WEB_0001.16
    title: Web UI — Included-In Reverse Lookup
    significance: shall
    description: >-
      The Web UI detail panel shall show which composite recipes include the selected recipe,
      displayed as an "Included in: X, Y" section
    references:
      requirement_ids: ["WEB_0001"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: WEB_0001.17
    title: Web UI — Export Config to Build Tool Format
    significance: should
    description: >-
      The Web UI shall allow exporting the current recipe selection as a Gradle or Maven
      plugin configuration snippet via a modal dialog, using the core ConfigExportService
    references:
      requirement_ids: ["WEB_0001", "CORE_0009"]
    categories: [compatibility]
    revision: 0.1.0

  # TUI requirements
  - id: TUI_0001
    title: TUI Launch
    significance: shall
    description: >-
      The tool shall provide an interactive TUI via CLI subcommand,
      with recipe browsing, search, selection, configuration, and execution
    categories: [interaction-capability]
    revision: 0.2.0

  - id: TUI_0001.1
    title: TUI — Recipe Table
    significance: shall
    description: The TUI shall display a scrollable table of recipes with name, description, and tags
    references:
      requirement_ids: ["TUI_0001"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: TUI_0001.2
    title: TUI — Recipe Detail Panel
    significance: shall
    description: The TUI shall show a side panel with recipe details when a recipe is highlighted
    references:
      requirement_ids: ["TUI_0001"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: TUI_0001.3
    title: TUI — Search Filter
    significance: shall
    description: The TUI shall support real-time search filtering of the recipe list
    references:
      requirement_ids: ["TUI_0001"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: TUI_0001.4
    title: TUI — Recipe Detail View
    significance: shall
    description: The TUI shall display a full-screen detail view when a recipe is selected
    references:
      requirement_ids: ["TUI_0001"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: TUI_0001.5
    title: TUI — Multi-Select
    significance: shall
    description: The TUI shall support selecting multiple recipes for batch operations
    references:
      requirement_ids: ["TUI_0001"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: TUI_0001.6
    title: TUI — Recipe Ordering
    significance: shall
    description: The TUI shall support sorting recipes by name or tags
    references:
      requirement_ids: ["TUI_0001"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: TUI_0001.7
    title: TUI — Recipe Options
    significance: shall
    description: The TUI shall allow configuring recipe options before execution
    references:
      requirement_ids: ["TUI_0001"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: TUI_0001.8
    title: TUI — Dry-Run Preview
    significance: shall
    description: The TUI shall show a preview of changes before applying recipes
    references:
      requirement_ids: ["TUI_0001"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: TUI_0001.9
    title: TUI — Recipe Execution
    significance: shall
    description: The TUI shall execute selected recipes and display results
    references:
      requirement_ids: ["TUI_0001"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: TUI_0001.19
    title: TUI — Results File Navigation
    significance: shall
    description: The TUI shall allow the user to navigate the list of changed files in execution and dry-run results
    references:
      requirement_ids: ["TUI_0001"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: TUI_0001.20
    title: TUI — File Diff View
    significance: shall
    description: The TUI shall display a before/after diff panel for any changed file selected from the results list
    references:
      requirement_ids: ["TUI_0001"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: TUI_0001.10
    title: TUI — Save Run Config
    significance: shall
    description: The TUI shall support saving the current recipe setup to a portable YAML file
    references:
      requirement_ids: ["TUI_0001"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: TUI_0001.11
    title: TUI — Tag Browser
    significance: shall
    description: The TUI shall provide a tag-based browser for filtering recipes by tag
    references:
      requirement_ids: ["TUI_0001"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: TUI_0001.12
    title: TUI — Keyboard Navigation
    significance: shall
    description: The TUI shall support keyboard navigation and shortcuts for all interactions
    references:
      requirement_ids: ["TUI_0001"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: TUI_0001.13
    title: TUI — Composite Recipe Browsing
    significance: shall
    description: The TUI shall support browsing composite recipes with expand/collapse and destructive flatten
    references:
      requirement_ids: ["TUI_0001"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: TUI_0001.14
    title: TUI — Run Dialog
    significance: shall
    description: >-
      The TUI shall provide a navigable, reorderable recipe execution list with
      individual toggle, cycle selection, and composite expand/collapse/flatten
    references:
      requirement_ids: ["TUI_0001"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: TUI_0001.14.1
    title: TUI — Run Dialog Flatten-All
    significance: shall
    description: >-
      The TUI run dialog shall support flattening all composite recipes to their
      leaf constituents in a single operation, deduplicating any shared leaves
    references:
      requirement_ids: ["TUI_0001.14"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: TUI_0001.15
    title: TUI — Debug Logging
    significance: shall
    description: The TUI shall support writing debug output to a log file via --log-file option
    references:
      requirement_ids: ["TUI_0001"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: TUI_0001.16
    title: TUI — Recipe Coverage Indicators
    significance: shall
    description: >-
      The TUI shall visually indicate when a recipe is included by a selected
      composite, show which composites cover it in the detail panel, and allow
      the user to explicitly select a covered recipe for duplicate execution
    references:
      requirement_ids: ["TUI_0001"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: TUI_0001.17
    title: TUI — Cascade Multi-Select
    significance: shall
    description: >-
      The TUI shall support cascade-both-ways checkbox selection for composite
      recipes: selecting a composite selects all transitive sub-recipes; selecting
      all sub-recipes of a composite auto-selects the composite; deselecting any
      sub-recipe without deselecting all puts the composite in an indeterminate
      (partial) visual state
    references:
      requirement_ids: ["TUI_0001"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: TUI_0001.18
    title: TUI — CSS Theming
    significance: shall
    description: >-
      The TUI shall support CSS-based theming via TamboUI TCSS stylesheets,
      shipping bundled dark and light themes, with user-provided CSS file support
      and theme selection via --theme CLI flag
    references:
      requirement_ids: ["TUI_0001"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: TUI_0001.19
    title: TUI — Load Run Config
    significance: shall
    description: >-
      The TUI shall support loading a previously saved run configuration from an
      atunko/runs/*.yml file, replacing the current recipe selection
    references:
      requirement_ids: ["TUI_0001"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: TUI_0001.20
    title: TUI — Markdown Recipe Descriptions
    significance: shall
    description: >-
      The TUI detail view shall render recipe descriptions as formatted markdown
      using the tamboui-toolkit-markdown library
    references:
      requirement_ids: ["TUI_0001"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: TUI_0001.21
    title: TUI — Export Config Overlay
    significance: shall
    description: >-
      The TUI shall provide an export overlay accessible from the confirm-run
      screen (x key) that displays the current run configuration as a Maven or
      Gradle plugin snippet using the core ConfigExportService
    references:
      requirement_ids: ["TUI_0001", "CORE_0009"]
    categories: [compatibility]
    revision: 0.1.0

  - id: TUI_0001.22
    title: TUI — Export Format Toggle
    significance: shall
    description: >-
      The export overlay shall support toggling between Gradle and Maven output
      formats via the g and m keys
    references:
      requirement_ids: ["TUI_0001.21"]
    categories: [compatibility]
    revision: 0.1.0

  - id: TUI_0001.23
    title: TUI — Export Mode Toggle
    significance: shall
    description: >-
      The export overlay shall support toggling between Minimal (plugin snippet
      only) and Full (standalone build file) output modes via the Tab key
    references:
      requirement_ids: ["TUI_0001.21"]
    categories: [compatibility]
    revision: 0.1.0

  - id: TUI_0001.24
    title: TUI — Recipe Options Overlay
    significance: shall
    description: >-
      The TUI shall provide a full-screen options overlay, accessible by pressing the
      `o` key from both the recipe list (browse/search) screen and the confirm-run
      screen, that displays all configurable options for the currently focused recipe
      including each option's name, type, required flag, description, example,
      valid values, and current configured value; if the recipe has no options the
      overlay shall display a "No configurable options" message
    references:
      requirement_ids: ["TUI_0001", "CORE_0014"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: TUI_0001.25
    title: TUI — Recipe Option Value Editing
    significance: shall
    description: >-
      Within the recipe options overlay the user shall be able to navigate options
      with j/k, press Enter to edit a string or integer option value via inline
      text input, toggle a boolean option between true/false/(unset) with Enter,
      and clear an option value with Delete/Backspace; edited values shall be stored
      on the controller keyed by recipe name and option name; pressing Esc while
      editing shall cancel the edit, and pressing Esc when not editing shall close
      the overlay
    references:
      requirement_ids: ["TUI_0001.24"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: TUI_0001.26
    title: TUI — Options Applied to RunConfig
    significance: shall
    description: >-
      When building a RunConfig for execution or export, configured option values
      stored on the controller shall be merged into the corresponding RecipeEntry
      options map; recipes with no configured options shall have a null options map
      (consistent with @JsonInclude NON_NULL serialisation)
    references:
      requirement_ids: ["TUI_0001.24", "TUI_0001.25"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: TUI_0001.27
    title: TUI — Mouse Capture Enabled
    significance: shall
    description: >-
      The TUI shall enable OS-level mouse capture so that scroll and click events are
      delivered to view mouse-event handlers; both the default and logging variants of
      TuiConfig must enable mouseCapture(true)
    categories: [functional-suitability]
    revision: 0.1.0

  # CLI requirements — list/search/run
  - id: CLI_0001
    title: CLI Default Behaviour — Launch TUI
    significance: shall
    description: >-
      When the tool is invoked without a subcommand, it shall launch the interactive TUI
      (equivalent to running `atunko tui`)
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CLI_0002
    title: CLI Recipe Listing
    significance: shall
    description: The tool shall list all available recipes via CLI subcommand, with selectable output format and sort order
    categories: [functional-suitability]
    revision: 0.2.0

  - id: CLI_0002.1
    title: List — Text Format
    significance: shall
    description: The list subcommand shall display recipes in human-readable text format
    references:
      requirement_ids: ["CLI_0002"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CLI_0002.2
    title: List — JSON Format
    significance: shall
    description: The list subcommand shall display recipes in JSON format
    references:
      requirement_ids: ["CLI_0002"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CLI_0002.3
    title: List — Sort by Name
    significance: shall
    description: The list subcommand shall support sorting recipes alphabetically by name
    references:
      requirement_ids: ["CLI_0002"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CLI_0002.4
    title: List — Sort by Tags
    significance: shall
    description: The list subcommand shall support sorting recipes by first tag, then by name
    references:
      requirement_ids: ["CLI_0002"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CLI_0003
    title: CLI Recipe Execution
    significance: shall
    description: The tool shall execute recipes via CLI subcommand
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CLI_0004
    title: CLI Recipe Search
    significance: shall
    description: The tool shall search recipes by keyword via CLI subcommand, with selectable output format, sort order, and field filter
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CLI_0004.1
    title: Search — Text Format
    significance: shall
    description: The search subcommand shall display matching recipes in human-readable text format
    references:
      requirement_ids: ["CLI_0004"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CLI_0004.2
    title: Search — JSON Format
    significance: shall
    description: The search subcommand shall display matching recipes in JSON format
    references:
      requirement_ids: ["CLI_0004"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CLI_0004.3
    title: Search — Sort by Name
    significance: shall
    description: The search subcommand shall support sorting matching recipes alphabetically by name
    references:
      requirement_ids: ["CLI_0004"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CLI_0004.4
    title: Search — Sort by Tags
    significance: shall
    description: The search subcommand shall support sorting matching recipes by first tag, then by name
    references:
      requirement_ids: ["CLI_0004"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CLI_0004.5
    title: Search — Field Filter
    significance: shall
    description: The search subcommand shall support filtering which recipe fields (name, displayName, description, tags) the query matches against
    references:
      requirement_ids: ["CLI_0004"]
    categories: [functional-suitability]
    revision: 0.1.0

  # Core requirements
  - id: CORE_0001
    title: Recipe Discovery
    significance: shall
    description: The core engine shall discover all OpenRewrite recipes from the classpath
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CORE_0001.1
    title: Composite Recipe Discovery
    significance: shall
    description: The engine shall expose composite recipe structure (recipeList with sub-recipes)
    references:
      requirement_ids: ["CORE_0001"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CORE_0002
    title: Recipe Search
    significance: shall
    description: The core engine shall support searching recipes by name, description, and tags
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CORE_0003
    title: Recipe Execution
    significance: shall
    description: The core engine shall execute selected OpenRewrite recipes against a target project
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CORE_0003.1
    title: Multi-File-Type Parsing
    significance: shall
    description: >-
      The engine shall parse all OpenRewrite-supported file types (Java, XML, YAML,
      JSON, properties) from project source and resource directories
    references:
      requirement_ids: ["CORE_0003"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CORE_0004
    title: Project Scanning — Build System Auto-Detection
    significance: shall
    description: >-
      The core engine shall auto-detect which build system (Gradle, Maven) is in use for a given
      project directory and select the appropriate scanner, failing fast with a clear error if no
      recognized build files are found.
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CORE_GRADLE_0001
    title: Gradle Project Support
    significance: shall
    description: >-
      The core engine shall resolve classpaths, source dirs, resource dirs, and test dirs
      for Gradle projects via Tooling API
    references:
      requirement_ids: ["CORE_0004"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CORE_MAVEN_0001
    title: Maven Project Support
    significance: shall
    description: The core engine shall resolve classpaths and source dirs for Maven projects
    references:
      requirement_ids: ["CORE_0004"]
    categories: [functional-suitability]
    revision: 0.1.0

  # CORE_0005 is intentionally vacant — was Maven Project Support, now CORE_MAVEN_0001

  - id: CORE_0006
    title: Git Integration
    significance: should
    description: The core engine should detect git repos and support stash-based versioning
    categories: [functional-suitability, safety]
    revision: 0.1.0

  - id: CORE_0006.1
    title: Git — Repository Detection
    significance: should
    description: >-
      The core engine should detect whether a project directory is inside a git
      working tree, so that git-dependent features can degrade gracefully when
      it is not
    references:
      requirement_ids: ["CORE_0006"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CORE_0006.2
    title: Git — Pre-Execution Stash Checkpoint
    significance: should
    description: >-
      Before a recipe run applies changes, the core engine should be able to record
      a stash-based safety checkpoint that is restorable with a single git command
      and that never removes or alters the user's uncommitted working-tree changes,
      not even transiently
    references:
      requirement_ids: ["CORE_0006"]
    categories: [functional-suitability, safety]
    revision: 0.1.0

  - id: CORE_0006.3
    title: Git — CLI Checkpoint Flag
    significance: should
    description: >-
      The run subcommand should accept a --git-checkpoint flag that creates the
      safety checkpoint before execution and prints the stash reference together
      with the restore command; when the target is not a git repository the command
      should print a clear message and continue without a checkpoint
    references:
      requirement_ids: ["CORE_0006"]
    categories: [functional-suitability, safety]
    revision: 0.1.0

  - id: CORE_0007
    title: Save Run Configuration
    significance: shall
    description: The tool shall save current recipe setup to a portable YAML file (.atunko.yml)
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CORE_0008
    title: Load Run Configuration
    significance: shall
    description: The tool shall load and execute from a saved configuration file
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CORE_0009
    title: Export Configuration
    significance: should
    description: The tool should export run configs to Maven/Gradle plugin format
    categories: [compatibility]
    revision: 0.1.0

  - id: CORE_0007.1
    title: Save Run Configuration — Workspace Block
    significance: shall
    description: >-
      When saving a run configuration that includes a workspace, the tool shall include
      the workspace root and glob filters in the .atunko.yml file
    references:
      requirement_ids: ["CORE_0007"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CORE_0008.1
    title: Load Run Configuration — Workspace Block
    significance: shall
    description: >-
      When loading a run configuration, the tool shall deserialise the optional
      workspace block and make it available for workspace-mode execution
    references:
      requirement_ids: ["CORE_0008"]
    categories: [functional-suitability]
    revision: 0.1.0

  # Workspace support
  - id: CORE_0010
    title: Workspace Scanning
    significance: shall
    description: >-
      The core engine shall discover all Gradle and Maven projects under a given root
      directory by walking the directory tree top-down, returning a Workspace containing
      a list of ProjectEntry (projectDir + ProjectInfo) pairs
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CORE_0010.1
    title: Workspace Scanner — Skip Build Output Directories
    significance: shall
    description: >-
      The workspace scanner shall skip build/, target/, .gradle/, node_modules/,
      .git/, and hidden directories (names starting with .) during the tree walk
    references:
      requirement_ids: ["CORE_0010"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CORE_0010.2
    title: Workspace Scanner — .atunkoignore Marker
    significance: shall
    description: >-
      The workspace scanner shall not descend into any directory that contains
      a .atunkoignore file
    references:
      requirement_ids: ["CORE_0010"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CORE_0010.3
    title: Workspace Scanner — Gradle Multi-Project Root Handling
    significance: shall
    description: >-
      When the workspace scanner encounters a settings.gradle or settings.gradle.kts file,
      it shall parse include declarations to determine subproject directories and exclude
      those directories from further independent scanning, treating the root as a single project
    references:
      requirement_ids: ["CORE_0010"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CORE_0010.4
    title: Workspace Scanner — Maven Multi-Module Root Handling
    significance: shall
    description: >-
      When the workspace scanner encounters a pom.xml containing a <modules> block,
      it shall treat that directory as a Maven multi-module root and exclude its
      declared module directories from further independent scanning
    references:
      requirement_ids: ["CORE_0010"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CORE_0010.5
    title: ProjectEntry Type
    significance: shall
    description: >-
      The core engine shall provide a ProjectEntry record that pairs a project
      directory path with its corresponding ProjectInfo, used as the unit of
      identity throughout workspace operations
    references:
      requirement_ids: ["CORE_0010"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CORE_0011
    title: Workspace Execution
    significance: shall
    description: >-
      The core engine shall execute a named recipe sequentially across all projects
      in a Workspace, returning a WorkspaceExecutionResult containing per-project results
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CORE_0011.1
    title: Workspace Execution — Per-Project Failure Isolation
    significance: shall
    description: >-
      A failure (exception or execution error) in one project shall not abort the
      workspace execution loop; the failure shall be captured in the ProjectExecutionResult
      for that project and execution shall continue with remaining projects
    references:
      requirement_ids: ["CORE_0011"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CORE_0012
    title: Run Configuration — Workspace Block
    significance: shall
    description: >-
      The RunConfig model shall support an optional workspace block containing
      a root path and optional include/exclude glob filters; when absent, single-project
      mode is assumed
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CORE_0013
    title: Core — Recipe Coverage Computation
    significance: shall
    description: >-
      The core module shall provide a utility that, given the current set of selected
      recipes, computes which recipes are transitively covered (i.e. included as
      sub-recipes of a selected composite)
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CORE_0013.1
    title: Core — Recipe Reverse-Index
    significance: shall
    description: >-
      The core module shall provide a utility that builds a reverse index mapping
      each recipe to the list of composite recipes that directly or transitively
      contain it, enabling efficient "included in" lookups
    references:
      requirement_ids: ["CORE_0013"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CORE_0014
    title: Core — Recipe Option Metadata
    significance: shall
    description: >-
      RecipeInfo shall include a list of RecipeOptionInfo entries representing the
      configurable options declared by the recipe, populated from OpenRewrite's
      OptionDescriptor at discovery time
    references:
      requirement_ids: ["CORE_0001.1"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CORE_0014.1
    title: Core — RecipeOptionInfo Fields
    significance: shall
    description: >-
      RecipeOptionInfo shall capture: name, type, displayName, description, example
      (nullable), valid values list (nullable), required flag, and defaultValue
      (nullable), providing all information needed to render and validate an option
      in a UI without depending on the OpenRewrite OptionDescriptor type directly
    references:
      requirement_ids: ["CORE_0014"]
    categories: [functional-suitability]
    revision: 0.1.0

  # CLI workspace requirements
  - id: CLI_0005
    title: CLI Workspace Support
    significance: shall
    description: >-
      The run and list CLI subcommands shall accept a --workspace <dir> option that
      scans the given directory for projects and operates across all discovered projects
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CLI_0005.1
    title: CLI Workspace — Per-Project Summary Table
    significance: shall
    description: >-
      After a workspace run, the CLI shall print a per-project summary table showing
      each project name, number of changed files, and pass/fail status
    references:
      requirement_ids: ["CLI_0005"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CLI_0005.2
    title: CLI Workspace — Non-Zero Exit on Failure
    significance: shall
    description: >-
      If any project fails during a workspace run, the CLI process shall exit with
      a non-zero exit code
    references:
      requirement_ids: ["CLI_0005"]
    categories: [functional-suitability]
    revision: 0.1.0

  # JBang distribution
  - id: CLI_0006
    title: JBang Zero-Install Distribution
    significance: shall
    description: >-
      The repository shall provide a JBang catalog defining an atunko alias that runs the
      released shadow JAR, so that users can execute atunko with jbang
      atunko@atunko-dev/atunko <args> without cloning or building the project
    categories: [compatibility]
    revision: 0.1.0

  # Web UI workspace requirements
  - id: WEB_0002
    title: Web UI — Workspace Scan and Multi-Select
    significance: shall
    description: >-
      The Web UI shall provide a "Scan workspace" toggle on the project-dir picker
      that scans the given directory and displays discovered projects in a multi-select list
    references:
      requirement_ids: ["WEB_0001"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: WEB_0002.1
    title: Web UI — Per-Project Execution Progress
    significance: shall
    description: >-
      The Web UI execution dialog shall show per-project progress during a workspace run,
      displaying the current project name and N-of-M count
    references:
      requirement_ids: ["WEB_0002"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: WEB_0002.2
    title: Web UI — Aggregate Results Table
    significance: shall
    description: >-
      After a workspace run the Web UI shall display an aggregate results table with
      a per-project row showing project name, changed file count, and pass/fail status
    references:
      requirement_ids: ["WEB_0002"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: WEB_0002.3
    title: Web UI — Scoped Diff Viewer
    significance: shall
    description: >-
      The Web UI diff viewer shall scope to one project at a time with a dropdown
      to switch between projects when a workspace run has been performed
    references:
      requirement_ids: ["WEB_0002"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: WEB_0002.4
    title: Web UI — Persist Workspace Config
    significance: shall
    description: >-
      The Web UI shall persist the workspace root path in the session and run
      configuration, allowing it to be saved and reloaded via .atunko.yml
    references:
      requirement_ids: ["WEB_0002"]
    categories: [interaction-capability]
    revision: 0.1.0

  # TUI workspace requirements
  - id: TUI_0002
    title: TUI Workspace Support
    significance: shall
    description: >-
      The TUI shall support a --workspace option that scans a root directory for
      projects and initialises a multi-project session, allowing recipe execution
      across all discovered projects
    categories: [functional-suitability]
    revision: 0.1.0

  - id: TUI_0002.1
    title: TUI — --workspace Option
    significance: shall
    description: >-
      The TUI subcommand shall accept a --workspace <path> option that is mutually
      exclusive with --project-dir; when supplied it scans the path with
      WorkspaceScanner and calls SessionHolder.initWorkspace()
    references:
      requirement_ids: ["TUI_0002"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: TUI_0002.2
    title: TUI — Run Dialog Shows All Workspace Projects
    significance: shall
    description: >-
      When in workspace mode the Run Recipes dialog shall display the list of all
      discovered project directory names instead of the single-project path line
    references:
      requirement_ids: ["TUI_0002"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: TUI_0002.3
    title: TUI — Workspace Execution via WorkspaceExecutionEngine
    significance: shall
    description: >-
      When in workspace mode the TUI shall execute selected recipes across all
      workspace projects using WorkspaceExecutionEngine and navigate to the
      WORKSPACE_RESULTS screen on completion
    references:
      requirement_ids: ["TUI_0002"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: TUI_0002.4
    title: TUI — Aggregate Workspace Results Screen
    significance: shall
    description: >-
      After a workspace run the TUI shall display a per-project results table
      showing each project directory name, the number of changed files, and
      pass/fail status for each project
    references:
      requirement_ids: ["TUI_0002"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: TUI_0002.5
    title: TUI — Workspace Config Directory
    significance: shall
    description: >-
      When in workspace mode run configurations shall be saved to and loaded from
      <workspaceRoot>/atunko/runs/ rather than the single-project directory
    references:
      requirement_ids: ["TUI_0002"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: TUI_0003
    title: TUI Headless End-to-End Verifiability
    significance: shall
    description: >-
      The TUI shall be launchable against a headless virtual-terminal backend and
      drivable programmatically with key, mouse, and resize events so that end-to-end
      behaviour (rendering, input routing, screen transitions) can be verified by
      automated tests without a real terminal
    categories: [functional-suitability]
    revision: 0.1.0

  # Recipe applicability requirements
  - id: CORE_0015
    title: Core — Recipe Applicability Detection
    significance: shall
    description: >-
      The core module shall determine, for each recipe and a given set of source
      capabilities produced by parsing a project, whether the recipe is able to act
      on that source set, and shall provide a human-readable reason when it is not,
      so that a genuinely clean project can be told apart from a recipe that never
      had a chance to act
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CORE_0015.1
    title: Core — Parsed Source Capability Reporting
    significance: shall
    description: >-
      ProjectSourceParser shall report the set of SourceCapability values that the
      parsed source set actually provides (JAVA, XML, YAML, JSON, PROPERTIES per the
      file types successfully parsed); MAVEN and GRADLE shall only be reported when
      a Maven or Gradle build model was genuinely produced, never merely because
      build files exist on disk
    references:
      requirement_ids: ["CORE_0015"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CORE_0015.2
    title: Core — Applicability by Recipe Name Prefix and Composition
    significance: shall
    description: >-
      Recipes named org.openrewrite.maven.* shall require the MAVEN capability and
      recipes named org.openrewrite.gradle.* shall require the GRADLE capability;
      all other recipes shall be treated as applicable; a composite recipe shall be
      applicable if and only if at least one of its transitive sub-recipes is
      applicable, with traversal guarded against cycles
    references:
      requirement_ids: ["CORE_0015"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CORE_0015.3
    title: Core — Applicability Caching
    significance: shall
    description: >-
      Applicability results shall be cached per capability set and recipe name so
      that browsing thousands of recipes does not recompute composite traversals
    references:
      requirement_ids: ["CORE_0015"]
    categories: [performance-efficiency]
    revision: 0.1.0

  - id: CORE_0016
    title: Core — Maven Build Model Parsing
    significance: shall
    description: >-
      The core module shall parse a project's pom.xml files with OpenRewrite's Maven
      parser so that the resulting documents carry a MavenResolutionResult marker,
      which is what every org.openrewrite.maven.* recipe requires in order to act;
      XML files that are not poms shall keep being parsed by the generic XML parser
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CORE_0016.1
    title: Core — Whole-Build Pom Parsing
    significance: shall
    description: >-
      All poms of a project shall be discovered — including the poms of the modules of
      a multi-module build, which live outside the source and resource directories —
      and shall be parsed in a single parser invocation, so that parent/child and
      inter-module relationships resolve against each other rather than against a
      remote repository
    references:
      requirement_ids: ["CORE_0016"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CORE_0016.2
    title: Core — Maven Parse Fallback
    significance: shall
    description: >-
      When a pom cannot be resolved into a Maven build model (unresolvable parent or
      dependency, offline or air-gapped run) it shall fall back to being parsed as
      plain XML without parse-failure markers, and the MAVEN capability shall not be
      reported for it, so that applicability badges stay honest instead of promising
      an ability the source set does not have
    references:
      requirement_ids: ["CORE_0016"]
    categories: [functional-suitability, reliability]
    revision: 0.1.0

  - id: CORE_0016.3
    title: Core — Pre-Parse Capability Hint
    significance: shall
    description: >-
      Before a project has been parsed, the capability set used for badging shall be
      seeded from the detected project type — MAVEN when the project root has a
      pom.xml — and shall be replaced by the capabilities the parse actually produced
      as soon as the project is parsed; GRADLE shall never be hinted, because Gradle
      build files are not parsed at all
    references:
      requirement_ids: ["CORE_0016"]
    categories: [functional-suitability, usability]
    revision: 0.1.0

  - id: CORE_0017
    title: Core — Lazy Session Initialisation
    significance: shall
    description: >-
      A single-project session shall be initialisable lazily: startup shall record the
      project directory only, and the build-system scan — the expensive Gradle Tooling
      API connection or Maven invocation — shall be deferred until the project model is
      first needed, so that the TUI and the Web UI launch without waiting for it
    categories: [performance-efficiency]
    revision: 0.1.0

  - id: CORE_0017.1
    title: Core — Memoized Thread-Safe Scan
    significance: shall
    description: >-
      The deferred scan shall run at most once per session and shall be safe to trigger
      from concurrent threads: callers that arrive while a scan is in progress shall
      block and then reuse its result rather than starting a second scan
    references:
      requirement_ids: ["CORE_0017"]
    categories: [performance-efficiency, reliability]
    revision: 0.1.0

  - id: CORE_0017.2
    title: Core — Scan Failure Is Retryable
    significance: shall
    description: >-
      A failing deferred scan shall propagate its exception to the caller and shall not
      be memoized, so that the session survives the failure and the next attempt runs
      the scan again; workspace sessions shall keep scanning eagerly at startup
    references:
      requirement_ids: ["CORE_0017"]
    categories: [reliability]
    revision: 0.1.0

  - id: TUI_0004
    title: TUI — Inapplicable Recipe Badging
    significance: shall
    description: >-
      The TUI recipe browser shall dim recipes that cannot act on the parsed source
      set and append a short badge naming the missing capability (for example
      "needs Maven" or "needs Gradle"); the detail view shall show the full reason;
      badging shall be purely informational and shall not change selection or
      execution behaviour
    references:
      requirement_ids: ["CORE_0015"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: TUI_0004.1
    title: TUI — Detail View Applicability Reason
    significance: shall
    description: >-
      When the highlighted recipe cannot act on the parsed source set the TUI detail
      view shall display an "Applicability:" line carrying the reason returned by
      the core applicability service
    references:
      requirement_ids: ["TUI_0004"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: TUI_0005
    title: TUI — Deferred Project Scan
    significance: shall
    description: >-
      The TUI shall launch a single-project session without scanning the project —
      validating only that build files exist — and shall trigger the scan on the first
      recipe execution, so that the interface is usable for browsing and configuring
      recipes while no project model has been built yet
    references:
      requirement_ids: ["CORE_0017"]
    categories: [performance-efficiency, interaction-capability]
    revision: 0.1.0

  - id: TUI_0005.1
    title: TUI — Execution-Time Scan Failure
    significance: shall
    description: >-
      When the deferred scan fails on a run, the TUI shall report the failure as an
      execution error inside the interface and shall keep the session alive so that the
      user can correct the project and run again, instead of terminating at startup
      with a stack trace
    references:
      requirement_ids: ["TUI_0005"]
    categories: [interaction-capability, reliability]
    revision: 0.1.0

  - id: WEB_0003
    title: Web UI — Inapplicable Recipe Badging
    significance: shall
    description: >-
      The Web UI recipe tree shall render recipes that cannot act on the parsed
      source set with a muted style and a badge naming the missing capability, with
      the full reason available as a tooltip, and shall show the reason in the recipe
      detail panel
    references:
      requirement_ids: ["CORE_0015"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: WEB_0004
    title: Web UI — Deferred Project Scan
    significance: shall
    description: >-
      The Web UI shall start serving a single-project session without scanning the
      project — validating only that build files exist — and shall trigger the scan in
      the existing background execution thread inside the progress dialog; a scan
      failure shall surface through the existing error notification and shall leave the
      view usable
    references:
      requirement_ids: ["CORE_0017"]
    categories: [performance-efficiency, interaction-capability]
    revision: 0.1.0

  # LST in-process caching (#11)
  - id: CORE_0018
    title: LST In-Process Caching
    significance: shall
    description: >-
      The core engine shall cache parsed LSTs in memory for the duration of a session,
      so that repeated recipe executions against unchanged sources skip re-parsing
    categories: [performance-efficiency]
    revision: 0.1.0

  - id: CORE_0018.1
    title: LST Cache Invalidation on Source Change
    significance: shall
    description: >-
      The LST cache shall detect changes to any source or build file of a cached project
      (added, removed, or modified content) and re-parse the project on the next execution
      instead of serving stale LSTs
    references:
      requirement_ids: ["CORE_0018"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CORE_0018.2
    title: LST Cache Per-Project Scope
    significance: shall
    description: >-
      The LST cache shall key entries by project directory so that each project of a
      workspace is cached and invalidated independently
    references:
      requirement_ids: ["CORE_0018"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CORE_0018.3
    title: LST Cache Disable
    significance: shall
    description: >-
      The LST cache shall be fully disabled when configured off, with every execution
      re-parsing the project sources
    references:
      requirement_ids: ["CORE_0018"]
    categories: [functional-suitability]
    revision: 0.1.0

  # Recipe source classification requirements
  - id: CORE_0019
    title: Core — Recipe Source Classification
    significance: shall
    description: >-
      Every discovered recipe shall carry a source classification telling where it came
      from: BUNDLED when it was discovered from atunko's own runtime classpath, USER when
      it was contributed by a recipe jar the user supplied, so that bundled and
      user-maintained recipes can be told apart honestly
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CORE_0019.1
    title: Core — User Recipe Jar Loading
    significance: shall
    description: >-
      The discovery environment shall be buildable with additional user-supplied recipe
      jars; recipes contributed by those jars — declarative or imperative — shall be
      discovered alongside the bundled catalog and shall be classified USER, while every
      other recipe, including sub-recipes of user composites that resolve to bundled
      recipes, shall remain classified BUNDLED
    references:
      requirement_ids: ["CORE_0019"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CORE_0019.2
    title: Core — Recipe Source Filtering
    significance: shall
    description: >-
      Recipe discovery and search shall be filterable by source with the values all,
      bundled, and user, applied to top-level recipes, with a single filtering
      implementation in the core module reused by every user interface
    references:
      requirement_ids: ["CORE_0019"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CLI_0008
    title: CLI — Recipe Source Filter on List and Search
    significance: shall
    description: >-
      The list and search subcommands shall accept a --source option with the values
      bundled, user, and all (defaulting to all) that filters the displayed recipes by
      their source classification
    references:
      requirement_ids: ["CORE_0019"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CLI_0008.1
    title: CLI — User Recipe Jars via --recipe-jar
    significance: shall
    description: >-
      The list and search subcommands shall accept a repeatable --recipe-jar <path>
      option that adds user recipe jars to the discovery environment, so that the
      recipes they contribute appear in the catalog classified as user recipes
    references:
      requirement_ids: ["CLI_0008"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: TUI_0006
    title: TUI — Recipe Source Toggle
    significance: shall
    description: >-
      The TUI recipe browser shall provide a source toggle key that cycles the recipe
      list filter through All, Bundled, and User, composing with the existing search
      and tag filters and resetting the highlight when cycled; the tui subcommand
      shall accept the same repeatable --recipe-jar option as list and search so that
      user recipes are available to the toggle
    references:
      requirement_ids: ["CORE_0019"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: TUI_0006.1
    title: TUI — Source Filter Indication
    significance: shall
    description: >-
      The TUI shall indicate the active recipe source filter in the browser status bar
      and shall document the source toggle key in the help overlay
    references:
      requirement_ids: ["TUI_0006"]
    categories: [interaction-capability]
    revision: 0.1.0

  # Recipe management requirements
  - id: CORE_0020
    title: Core — Custom Recipe YAML Loading
    significance: shall
    description: >-
      User-authored declarative OpenRewrite recipe YAML files shall be loadable into the
      discovery environment alongside the bundled catalog; recipes they contribute shall
      be discovered, classified USER under the recipe source classification, and shall be
      able to reference bundled recipes
    references:
      requirement_ids: ["CORE_0019"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CORE_0020.1
    title: Core — Explicit Recipe YAML Files via --recipes-file
    significance: shall
    description: >-
      The list, search, and tui subcommands shall accept a repeatable
      --recipes-file <path> option that adds user recipe YAML files to the discovery
      environment
    references:
      requirement_ids: ["CORE_0020"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CORE_0020.2
    title: Core — Recipe YAML Auto-Discovery from the Config Dir
    significance: shall
    description: >-
      Recipe YAML files placed in the recipes directory of the atunko config dir shall be
      auto-discovered and loaded without any command-line option; the config dir shall
      follow XDG conventions (XDG_CONFIG_HOME, falling back to ~/.config) and its
      location shall be overridable for tests
    references:
      requirement_ids: ["CORE_0020"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CORE_0020.3
    title: Core — Malformed Recipe YAML Resilience
    significance: shall
    description: >-
      A malformed user recipe YAML file shall never crash startup: the failure shall be
      reported as a clear warning naming the file, the file shall be skipped, and every
      other recipe source shall still load
    references:
      requirement_ids: ["CORE_0020"]
    categories: [reliability, functional-suitability]
    revision: 0.1.0

  - id: CORE_0021
    title: Core — Favorites Persistence
    significance: shall
    description: >-
      A recipe shall be markable and unmarkable as favorite, with the favorite names
      persisted to a favorites file in the atunko config dir (location overridable);
      a missing or malformed favorites file shall read as no favorites without
      blocking startup
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CORE_0021.1
    title: Core — Favorites Filter
    significance: shall
    description: >-
      Recipe browsing shall be filterable to favorites only, with a single cycling
      filter implementation in the core module reused by every user interface
    references:
      requirement_ids: ["CORE_0021"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CORE_0022
    title: Core — Recently Used Recipe Tracking
    significance: shall
    description: >-
      Recipe names shall be recorded with a timestamp whenever recipes are executed,
      persisted newest-first to a recent file in the atunko config dir (location
      overridable), deduplicated so a re-run moves a recipe to the front, and capped
      at 20 entries; a missing or malformed recent file shall read as empty
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CORE_0022.1
    title: Core — Recent-First Sort Order
    significance: shall
    description: >-
      A recent sort order shall order recipes recorded as recently used first, in
      recency order, with all remaining recipes following in name order; without
      recent context it shall degrade to name order
    references:
      requirement_ids: ["CORE_0022"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: TUI_0007
    title: TUI — Favorites
    significance: shall
    description: >-
      The TUI recipe browser shall provide a key that toggles favorite on the
      highlighted recipe, persisted through the core favorites service, and a key
      cycling a favorites filter between all recipes and favorites only, composing
      with the existing search, tag, and source filters and resetting the highlight
      and the filter on clear-all
    references:
      requirement_ids: ["CORE_0021"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: TUI_0007.1
    title: TUI — Favorite Indication
    significance: shall
    description: >-
      The TUI shall mark favorite recipes with a star marker in the recipe list,
      shall indicate the active favorites filter in the browser status bar, and
      shall document the favorite keys in the help overlay
    references:
      requirement_ids: ["TUI_0007"]
    categories: [interaction-capability]
    revision: 0.1.0

  - id: TUI_0008
    title: TUI — Recently Used Recipes
    significance: shall
    description: >-
      The TUI shall record executed recipes through the core recently-used service
      when a run is triggered and shall surface them via a recent sort order included
      in the browser sort cycle
    references:
      requirement_ids: ["CORE_0022"]
    categories: [interaction-capability]
    revision: 0.1.0

  # LST CLI daemon requirements
  - id: CORE_0023
    title: Core — LST Daemon Cross-Invocation Reuse
    significance: shall
    description: >-
      A long-lived daemon process shall retain a project's parsed LSTs in memory between
      separate CLI invocations, so that a recipe execution against an unchanged project
      skips both the build-system scan and the parse
    categories: [performance-efficiency]
    revision: 0.1.0

  - id: CORE_0023.1
    title: Core — Daemon Per Project Root
    significance: shall
    description: >-
      The daemon registry shall hold at most one daemon per resolved project root and shall
      retain at most a configured maximum number of daemons, evicting the least recently
      used idle daemon when the limit is exceeded and never evicting one serving a request
    references:
      requirement_ids: ["CORE_0023"]
    categories: [performance-efficiency]
    revision: 0.1.0

  - id: CORE_0023.2
    title: Core — Daemon Idle Expiry
    significance: shall
    description: >-
      A daemon shall exit on its own after a configurable idle period without requests,
      releasing the memory held by its cached LSTs
    references:
      requirement_ids: ["CORE_0023"]
    categories: [performance-efficiency]
    revision: 0.1.0

  - id: CORE_0023.3
    title: Core — Daemon Local Access Control
    significance: shall
    description: >-
      The daemon shall listen only on the loopback interface and shall refuse any request
      whose token does not match the token recorded in its owner-only registry file
    references:
      requirement_ids: ["CORE_0023"]
    categories: [security]
    revision: 0.1.0

  - id: CORE_0023.4
    title: Core — Daemon Version Match
    significance: shall
    description: >-
      A client shall refuse to reuse a daemon built from a different atunko version, stopping
      it and starting a replacement, so that LSTs parsed by a different OpenRewrite are never
      served
    references:
      requirement_ids: ["CORE_0023"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CLI_0009
    title: CLI — Transparent Daemon Execution
    significance: shall
    description: >-
      The run command shall execute through a daemon for the target project root, starting one
      when none is available, and shall produce output identical to in-process execution
    references:
      requirement_ids: ["CORE_0023"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CLI_0009.1
    title: CLI — Daemon Fallback
    significance: shall
    description: >-
      When a daemon cannot be started or reached, the run command shall fall back to
      in-process execution, report the reason as a warning, and still produce the correct
      result rather than failing
    references:
      requirement_ids: ["CLI_0009"]
    categories: [reliability]
    revision: 0.1.0

  - id: CLI_0009.2
    title: CLI — Daemon Opt-Out
    significance: shall
    description: >-
      The run command shall execute entirely in-process, contacting and starting no daemon,
      when the daemon is disabled by flag or configuration
    references:
      requirement_ids: ["CLI_0009"]
    categories: [functional-suitability]
    revision: 0.1.0

  - id: CLI_0009.3
    title: CLI — Daemon Control Commands
    significance: shall
    description: >-
      The CLI shall provide commands to list the running daemons with their project root,
      port, process id and idle time, and to stop a single daemon or all of them
    references:
      requirement_ids: ["CLI_0009"]
    categories: [interaction-capability]
    revision: 0.1.0
