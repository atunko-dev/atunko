name: PR Quality Gates

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  branch-naming:
    runs-on: ubuntu-latest
    steps:
      - uses: deepakputhraya/action-branch-name@v1.0.0
        with:
          # `renovate` is required: this job is a required check, so a branch
          # prefix it rejects can never merge.
          regex: '^(feat|feature|fix|bugfix|hotfix|release|chore|docs|refactor|test|ci|renovate)/[a-z0-9][a-z0-9.-]*$'
          ignore: main,master,develop
