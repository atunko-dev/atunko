name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ !github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify release targets main or release branch
        run: |
          TARGET="${{ github.event.release.target_commitish }}"
          if [[ "$TARGET" != "main" && "$TARGET" != release/* && "$TARGET" != hotfix/* ]]; then
            echo "Release target '$TARGET' is not main, a release/*, or hotfix/* branch"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Build
        run: ./gradlew build

      - name: Create stable-named JAR for the JBang catalog alias
        run: |
          shopt -s nullglob
          # build/libs also holds the thin atunko-cli-<version>.jar — keep only the shadow JAR
          shadow=()
          for jar in atunko-cli/build/libs/atunko-*.jar; do
            [[ "$(basename "$jar")" == atunko-cli-* ]] && continue
            shadow+=("$jar")
          done
          if [[ ${#shadow[@]} -ne 1 ]]; then
            echo "Expected exactly one versioned shadow JAR, found ${#shadow[@]}: ${shadow[*]}"
            exit 1
          fi
          cp "${shadow[0]}" atunko-cli/build/libs/atunko.jar

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          config: cliff.toml
          args: --latest --strip all

      - name: Upload JAR and update release body
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.content }}
          files: |
            atunko-cli/build/libs/atunko-*.jar
            atunko-cli/build/libs/atunko.jar
          fail_on_unmatched_files: true
