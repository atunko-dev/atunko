# reqstool-ai configuration for atunko
urn: atunko
revision: "0.1.0"
system:
  path: docs/reqstool
modules:
  core:
    path: atunko-core/docs/reqstool
    req_prefix: CORE_
    svc_prefix: SVC_CORE_
  cli:
    path: atunko-cli/docs/reqstool
    req_prefix: CLI_
    svc_prefix: SVC_CLI_
  daemon:
    # CORE_0023 lives in atunko-daemon, not atunko-core, so it needs a narrower prefix
    # than the core module's CORE_ to avoid claiming every core requirement.
    path: atunko-daemon/docs/reqstool
    req_prefix: CORE_0023
    svc_prefix: SVC_CORE_0023
  tui:
    path: atunko-tui/docs/reqstool
    req_prefix: TUI_
    svc_prefix: SVC_TUI_
  web:
    path: atunko-web/docs/reqstool
    req_prefix: WEB_
    svc_prefix: SVC_WEB_
